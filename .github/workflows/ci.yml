name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://mh_app:mh_app_dev@localhost:5432/mentors_hub
      MIGRATION_DATABASE_URL: postgres://mh_owner:mh_owner_dev@localhost:5432/mentors_hub
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
      MAIL_FROM: "Mentorship Hub <no-reply@example.test>"
      SMTP_URL: smtp://localhost:1025
      DEFAULT_TIME_ZONE: Asia/Baku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create database and roles
        run: ./scripts/dev-db.sh
      - name: Apply migrations
        run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and database tests (real PostgreSQL)
        run: npm test
      - run: npm run build
